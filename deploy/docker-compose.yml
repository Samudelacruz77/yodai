services:
  inference:
    build:
      context: ..
      dockerfile: deploy/Containerfile.inference
    devices:
      - nvidia.com/gpu=all
    security_opt:
      - label=disable
    volumes:
      - model-data:/data/models
    ports:
      - "8000:8000"
    environment:
      - ENGINE_DIR=/data/models/engine
      - TOKENIZER_DIR=/data/models/tokenizer

  yodai:
    build:
      context: ..
      dockerfile: deploy/Containerfile.yodai
    ports:
      - "8080:8080"
    environment:
      - YODAI_INFERENCE_URL=http://inference:8000
      - YODAI_LISTEN_ADDR=:8080
    depends_on:
      - inference

volumes:
  model-data:
    driver: local
