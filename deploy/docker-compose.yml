services:
  inference:
    image: quay.io/sdelacru/yodai-inference:latest
    devices:
      - nvidia.com/gpu=all
    security_opt:
      - label=disable
    ports:
      - "8000:8000"

  yodai:
    build:
      context: ..
      dockerfile: deploy/Containerfile.yodai
    ports:
      - "8080:8080"
    environment:
      - YODAI_INFERENCE_URL=http://inference:8000
      - YODAI_LISTEN_ADDR=:8080
    depends_on:
      - inference
